<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <!-- Gradients -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" fill="#ffffff" rx="16"/>

  <!-- Logo Icon: Stylized Computer Screen + Checkmark + Lagos Bridge silhouette -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <!-- Monitor frame -->
    <rect x="0" y="0" width="130" height="100" rx="12" fill="url(#greenGrad)"/>
    <!-- Screen -->
    <rect x="8" y="8" width="114" height="72" rx="6" fill="url(#screenGrad)"/>
    <!-- Stand -->
    <rect x="50" y="100" width="30" height="12" rx="3" fill="#14532d"/>
    <rect x="35" y="112" width="60" height="6" rx="3" fill="#14532d"/>

    <!-- Checkmark on screen -->
    <path d="M 38 42 L 52 58 L 92 28" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Lagos Bridge / Wave element (Eko reference) -->
    <path d="M 8 68 Q 30 58 50 68 Q 70 78 90 68 Q 110 58 122 68 L 122 80 L 8 80 Z" fill="rgba(255,255,255,0.15)"/>

    <!-- Small star accent -->
    <circle cx="108" cy="22" r="5" fill="#fbbf24"/>
  </g>

  <!-- Brand Name -->
  <g transform="translate(195, 55)">
    <!-- "eko" in green -->
    <text x="0" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="url(#greenGrad)">eko</text>
    <!-- "free" in gold accent -->
    <text x="105" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="url(#goldGrad)">free</text>
    <!-- "CBT" in dark green -->
    <text x="210" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#14532d">CBT</text>
    <!-- "hub" in green -->
    <text x="320" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="url(#greenGrad)">hub</text>

    <!-- Tagline -->
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#6b7280" letter-spacing="2">JAMB UTME PRACTICE PLATFORM · LAGOS, NIGERIA</text>
  </g>

  <!-- Decorative accent line -->
  <rect x="195" y="105" width="60" height="4" rx="2" fill="url(#goldGrad)"/>
</svg>